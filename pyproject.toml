[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-mv-dmer"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.8,<3",
    "PyYAML>=6.0.2,<7",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "hypothesis>=6.112,<7",
]

[project.scripts]
sc-mv-dmer = "sc_mv_dmer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
